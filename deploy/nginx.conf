# Rate-limit zone for auth endpoints (brute-force / signup-spam guard).
# Valid at http{} level — this file is included from inside http{} via sites-enabled.
limit_req_zone $binary_remote_addr zone=jobdrop_auth:10m rate=5r/m;

server {
    server_name jobdrop.site www.jobdrop.site;

    client_max_body_size 10M;

    # Throttle login/signup (burst lets a normal human through; bots get 503'd).
    location = /login {
        limit_req zone=jobdrop_auth burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
    location = /signup {
        limit_req zone=jobdrop_auth burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
    location = /api/feedback {
        limit_req zone=jobdrop_auth burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jobdrop.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jobdrop.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.jobdrop.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = jobdrop.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name jobdrop.site www.jobdrop.site;
    return 404; # managed by Certbot
}
