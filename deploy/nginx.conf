# Rate-limit zone for auth endpoints (brute-force / signup-spam guard).
# Valid at http{} level — this file is included from inside http{} via sites-enabled.
limit_req_zone $binary_remote_addr zone=jobdrop_auth:10m rate=5r/m;

server {
    listen 80;
    server_name _;   # replace with your domain if you have one

    client_max_body_size 10M;

    # Throttle login/signup (burst lets a normal human through; bots get 503'd).
    location = /login {
        limit_req zone=jobdrop_auth burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
    location = /signup {
        limit_req zone=jobdrop_auth burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
